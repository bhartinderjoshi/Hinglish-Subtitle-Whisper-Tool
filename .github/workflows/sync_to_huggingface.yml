name: Sync to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Deploy Clean Code to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Create a clean deployment directory with only application source code
          mkdir -p /tmp/hf_deployment
          rsync -av --exclude='.git' --exclude='.github' --exclude='examples' --exclude='*.wav' --exclude='*.mp4' --exclude='__pycache__' ./ /tmp/hf_deployment/
          
          cd /tmp/hf_deployment
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy latest Hinglish Subtitle Whisper Tool from GitHub"
          
          # Push clean deployment commit to Hugging Face Space
          git push --force https://BhartInderJoshi06:$HF_TOKEN@huggingface.co/spaces/BhartInderJoshi06/whisper-subtitle-generator main:main
          echo "✓ Successfully deployed clean codebase to Hugging Face Spaces!"
