name: Sync to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepare and Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Remove any binary audio/video files from git tracking so Hugging Face Space doesn't reject them
          git rm -r --cached --ignore-unmatch *.wav *.mp4 examples/*.wav || true
          
          if ! git diff --cached --quiet; then
            git commit -m "Remove binary files for Hugging Face Space sync"
          fi

          git push --force https://BhartInderJoshi06:$HF_TOKEN@huggingface.co/spaces/BhartInderJoshi06/whisper-subtitle-generator HEAD:main
