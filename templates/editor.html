<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Subtitle Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .subtitle-overlay {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 20px;
            font-weight: 500;
            text-align: center;
            max-width: 80%;
            line-height: 1.4;
            pointer-events: none;
            z-index: 10;
        }
        
        .video-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .subtitle-item {
            transition: all 0.2s;
        }
        
        .subtitle-item:hover {
            background: #f1f5f9;
        }
        
        .subtitle-item.active {
            background: #dbeafe;
            border-left: 3px solid #3b82f6;
        }
        
        .time-input {
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Video Subtitle Editor</h1>
                    <p class="text-sm text-slate-600">Edit and preview your subtitles in real-time</p>
                </div>
                <div class="flex gap-3">
                    <a href="/" class="px-4 py-2 bg-slate-600 text-white rounded-lg hover:bg-slate-700 transition-colors">
                        ← Back
                    </a>
                    <button id="downloadSrtBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        📥 Download SRT
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Upload Section -->
        <div id="uploadSection" class="bg-white rounded-lg border border-slate-200 p-8 mb-6">
            <form id="uploadForm" enctype="multipart/form-data">
                <div id="uploadArea" class="border-2 border-dashed border-slate-300 rounded-lg p-12 text-center cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition-all">
                    <input type="file" id="videoFile" name="video" accept="video/*" required class="hidden">
                    <div class="flex flex-col items-center gap-3">
                        <div class="w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center">
                            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-slate-900 mb-1">
                                <span class="text-blue-600">Click to upload</span> or drag and drop
                            </p>
                            <p class="text-xs text-slate-600">MP4, AVI, MOV, MKV, WEBM (Max 500MB)</p>
                        </div>
                    </div>
                </div>

                <div id="fileInfo" class="hidden mt-4 p-4 bg-slate-50 rounded-lg">
                    <div class="flex items-center gap-3">
                        <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                        <div class="flex-1">
                            <p class="text-sm font-medium text-slate-900" id="fileName"></p>
                            <p class="text-xs text-slate-600" id="fileSize"></p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-900 mb-2">AI Model</label>
                        <select id="model" name="model" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="apex">⭐ Apex - Ultimate quality</option>
                            <option value="prime">🏆 Prime - Best quality</option>
                            <option value="swift">⚡ Swift - Faster</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-900 mb-2">Max Words per Subtitle</label>
                        <input type="number" id="maxWords" name="maxWords" value="4" min="1" max="10" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <button type="submit" id="generateBtn" class="w-full mt-6 px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
                    Generate Subtitles
                </button>

                <div id="progress" class="hidden mt-4">
                    <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
                        <div id="progressBar" class="h-full bg-blue-600 transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <p id="status" class="text-sm text-center text-slate-600 mt-2"></p>
                </div>
            </form>
        </div>

        <!-- Editor Section -->
        <div id="editorSection" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Video Preview -->
                <div class="bg-white rounded-lg border border-slate-200 p-4">
                    <h2 class="text-lg font-semibold text-slate-900 mb-4">Video Preview</h2>
                    <div class="video-container">
                        <video id="videoPlayer" class="w-full" controls>
                            <source id="videoSource" src="" type="video/mp4">
                        </video>
                        <div id="subtitleOverlay" class="subtitle-overlay hidden"></div>
                    </div>
                    <div class="mt-4 flex items-center gap-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="showSubtitles" checked class="w-4 h-4 text-blue-600 rounded focus:ring-2 focus:ring-blue-500">
                            <span class="text-sm text-slate-700">Show subtitles on video</span>
                        </label>
                    </div>
                </div>

                <!-- Subtitle Editor -->
                <div class="bg-white rounded-lg border border-slate-200 p-4">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-slate-900">Subtitle Editor</h2>
                        <button id="addSubtitleBtn" class="px-3 py-1 text-sm bg-green-600 text-white rounded hover:bg-green-700 transition-colors">
                            + Add Subtitle
                        </button>
                    </div>
                    <div id="subtitleList" class="space-y-2 max-h-[600px] overflow-y-auto">
                        <!-- Subtitles will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let subtitles = [];
        let videoBlob = null;
        let videoFileName = '';

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('videoFile');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadForm = document.getElementById('uploadForm');
        const generateBtn = document.getElementById('generateBtn');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const status = document.getElementById('status');
        const uploadSection = document.getElementById('uploadSection');
        const editorSection = document.getElementById('editorSection');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoSource = document.getElementById('videoSource');
        const subtitleOverlay = document.getElementById('subtitleOverlay');
        const showSubtitles = document.getElementById('showSubtitles');
        const subtitleList = document.getElementById('subtitleList');
        const downloadSrtBtn = document.getElementById('downloadSrtBtn');
        const addSubtitleBtn = document.getElementById('addSubtitleBtn');

        // Upload area interactions
        uploadArea.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.add('border-blue-500', 'bg-blue-50');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.remove('border-blue-500', 'bg-blue-50');
            });
        });

        uploadArea.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                displayFileInfo(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                displayFileInfo(e.target.files[0]);
            }
        });

        function displayFileInfo(file) {
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.remove('hidden');
            videoFileName = file.name;
            videoBlob = file;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Form submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(uploadForm);
            formData.append('returnType', 'text');

            generateBtn.disabled = true;
            progress.classList.remove('hidden');
            progressBar.style.width = '60%';
            status.textContent = 'Processing video and generating subtitles...';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Failed to generate subtitles');
                }

                const srtContent = await response.text();
                progressBar.style.width = '100%';
                status.textContent = 'Subtitles generated! Loading editor...';

                // Parse SRT and load editor
                subtitles = parseSRT(srtContent);
                loadEditor();

                setTimeout(() => {
                    progress.classList.add('hidden');
                    generateBtn.disabled = false;
                    progressBar.style.width = '0%';
                }, 1000);

            } catch (error) {
                status.textContent = 'Error: ' + error.message;
                status.classList.add('text-red-600');
                generateBtn.disabled = false;
                progressBar.style.width = '0%';
            }
        });

        function parseSRT(srtContent) {
            const blocks = srtContent.trim().split('\n\n');
            return blocks.map(block => {
                const lines = block.split('\n');
                const index = parseInt(lines[0]);
                const times = lines[1].split(' --> ');
                const text = lines.slice(2).join('\n');
                
                return {
                    index,
                    startTime: times[0],
                    endTime: times[1],
                    text
                };
            });
        }

        function loadEditor() {
            // Hide upload, show editor
            uploadSection.classList.add('hidden');
            editorSection.classList.remove('hidden');

            // Load video
            const videoUrl = URL.createObjectURL(videoBlob);
            videoSource.src = videoUrl;
            videoPlayer.load();

            // Render subtitles
            renderSubtitles();

            // Enable download
            downloadSrtBtn.disabled = false;
        }

        function renderSubtitles() {
            subtitleList.innerHTML = '';
            
            subtitles.forEach((sub, idx) => {
                const subDiv = document.createElement('div');
                subDiv.className = 'subtitle-item p-3 border border-slate-200 rounded-lg';
                subDiv.dataset.index = idx;
                
                subDiv.innerHTML = `
                    <div class="flex items-start gap-2 mb-2">
                        <span class="text-xs font-semibold text-slate-500 mt-1">#${sub.index}</span>
                        <div class="flex-1 grid grid-cols-2 gap-2">
                            <input type="text" value="${sub.startTime}" 
                                   class="time-input px-2 py-1 text-xs border border-slate-300 rounded focus:ring-1 focus:ring-blue-500"
                                   data-field="startTime" data-index="${idx}">
                            <input type="text" value="${sub.endTime}" 
                                   class="time-input px-2 py-1 text-xs border border-slate-300 rounded focus:ring-1 focus:ring-blue-500"
                                   data-field="endTime" data-index="${idx}">
                        </div>
                        <button class="delete-btn text-red-600 hover:text-red-700" data-index="${idx}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </div>
                    <textarea class="w-full px-2 py-1 text-sm border border-slate-300 rounded focus:ring-1 focus:ring-blue-500 resize-none"
                              rows="2" data-field="text" data-index="${idx}">${sub.text}</textarea>
                `;
                
                subtitleList.appendChild(subDiv);
            });

            // Add event listeners
            document.querySelectorAll('.time-input, textarea').forEach(input => {
                input.addEventListener('input', handleSubtitleEdit);
                input.addEventListener('click', handleSubtitleClick);
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', handleSubtitleDelete);
            });
        }

        function handleSubtitleEdit(e) {
            const index = parseInt(e.target.dataset.index);
            const field = e.target.dataset.field;
            subtitles[index][field] = e.target.value;
        }

        function handleSubtitleClick(e) {
            const index = parseInt(e.target.dataset.index);
            const startTime = timeToSeconds(subtitles[index].startTime);
            videoPlayer.currentTime = startTime;
            
            // Highlight active subtitle
            document.querySelectorAll('.subtitle-item').forEach(item => {
                item.classList.remove('active');
            });
            e.target.closest('.subtitle-item').classList.add('active');
        }

        function handleSubtitleDelete(e) {
            const index = parseInt(e.target.dataset.index);
            if (confirm('Delete this subtitle?')) {
                subtitles.splice(index, 1);
                // Reindex
                subtitles.forEach((sub, idx) => {
                    sub.index = idx + 1;
                });
                renderSubtitles();
            }
        }

        // Add new subtitle
        addSubtitleBtn.addEventListener('click', () => {
            const currentTime = videoPlayer.currentTime;
            const newSub = {
                index: subtitles.length + 1,
                startTime: secondsToTime(currentTime),
                endTime: secondsToTime(currentTime + 3),
                text: 'New subtitle text'
            };
            subtitles.push(newSub);
            renderSubtitles();
            subtitleList.scrollTop = subtitleList.scrollHeight;
        });

        // Video time update - show subtitle overlay
        videoPlayer.addEventListener('timeupdate', () => {
            if (!showSubtitles.checked) {
                subtitleOverlay.classList.add('hidden');
                return;
            }

            const currentTime = videoPlayer.currentTime;
            const currentSub = subtitles.find(sub => {
                const start = timeToSeconds(sub.startTime);
                const end = timeToSeconds(sub.endTime);
                return currentTime >= start && currentTime <= end;
            });

            if (currentSub) {
                subtitleOverlay.textContent = currentSub.text;
                subtitleOverlay.classList.remove('hidden');
                
                // Highlight in list
                document.querySelectorAll('.subtitle-item').forEach((item, idx) => {
                    if (idx === currentSub.index - 1) {
                        item.classList.add('active');
                        item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    } else {
                        item.classList.remove('active');
                    }
                });
            } else {
                subtitleOverlay.classList.add('hidden');
                document.querySelectorAll('.subtitle-item').forEach(item => {
                    item.classList.remove('active');
                });
            }
        });

        showSubtitles.addEventListener('change', () => {
            if (!showSubtitles.checked) {
                subtitleOverlay.classList.add('hidden');
            }
        });

        // Download SRT
        downloadSrtBtn.addEventListener('click', () => {
            const srtContent = generateSRT(subtitles);
            const blob = new Blob([srtContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = videoFileName.replace(/\.[^/.]+$/, '') + '.srt';
            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(url);
            document.body.removeChild(a);
        });

        function generateSRT(subs) {
            return subs.map(sub => {
                return `${sub.index}\n${sub.startTime} --> ${sub.endTime}\n${sub.text}\n`;
            }).join('\n');
        }

        function timeToSeconds(timeStr) {
            const parts = timeStr.split(':');
            const hours = parseInt(parts[0]);
            const minutes = parseInt(parts[1]);
            const seconds = parseFloat(parts[2].replace(',', '.'));
            return hours * 3600 + minutes * 60 + seconds;
        }

        function secondsToTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            const ms = Math.floor((secs % 1) * 1000);
            
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(Math.floor(secs)).padStart(2, '0')},${String(ms).padStart(3, '0')}`;
        }
    </script>
</body>
</html>
